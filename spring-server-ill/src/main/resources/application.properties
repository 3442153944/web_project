spring.application.name=spring-server-ill
server.port=1234
spring.devtools.restart.enabled=true
# ??SQL??
logging.level.org.springframework.jdbc.core=DEBUG

# MySQL ??
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/admin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=admin
